name: My First CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show files
        run: ls

      - name: Show current directory
        run: pwd

      - name: Show Git version
        run: git --version
      - name: Create test file
        run: echo "Hello from CI" > test.txt

      - name: Check test file
        run: cat test.txt
      - name: CI Check
        run: |
          echo "Running CI check..."
          test -f test.txt
          echo "CI check passed!"
      - name: Verify test file
        run: |
          echo "Testing test file..."
          test -f test.txt
          echo "Test file exists - CI check passed!"
      - name: Conditional step
        if: success()
        run: echo "All previous steps succeeded!"
      - name: Test failure condition
        run: |
          echo "This step will fail"
          exit 1

      - name: Run after failure
        if: success()
        run: echo "This should NOT run"
          