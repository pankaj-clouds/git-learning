name: My First CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show files
        run: ls

      - name: Show current directory
        run: pwd

      - name: Show Git version
        run: git --version
      - name: Create test file
        run: echo "Hello from CI" > test.txt

      - name: Check test file
        run: cat test.txt